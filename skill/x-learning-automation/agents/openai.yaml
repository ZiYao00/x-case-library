  default_prompt: "使用 $x-learning-automation 整理 X/Twitter 帖子；如果我明确给出多条 status URL 并要求批量转换，请走永久 Guest-only 的有界串行 Batch V1；如果我明确要求更新已有案例，请走受控 repair 流程。"
